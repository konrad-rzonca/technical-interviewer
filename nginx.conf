server {
    listen 8080;
    # Not the image's html folder, which holds nginx's stock welcome page.
    root /usr/share/nginx/site;
    # Redirects keep the host and port the browser used, whatever port Docker maps to 8080.
    absolute_redirect off;

    gzip on;
    gzip_types application/javascript text/javascript application/json text/css image/svg+xml;
    gzip_vary on;

    location = / {
        return 301 /technical-interviewer/;
    }

    # A path that is not a file gets index.html, so the app's router handles it.
    # Files outside static/ are revalidated on every load.
    location /technical-interviewer/ {
        try_files $uri /technical-interviewer/index.html;
        add_header Cache-Control "no-cache";
    }

    # File names here carry a content hash, so they never change.
    location /technical-interviewer/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /healtz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }
}
